<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Scrollitis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="reels.css" />
  <script>
    // GoatCounter analytics, production domain only (skips localhost, wrangler dev, previews).
    if (location.hostname === "scrollitis.misc.page") {
      const gc = document.createElement("script");
      gc.async = true;
      gc.src = "https://gc.zgo.at/count.js";
      gc.dataset.goatcounter = "https://scrollitis.goatcounter.com/count";
      document.head.appendChild(gc);
    }
  </script>
</head>
<body>
  <div id="app">

    <main id="feed">
      <div id="track"></div>
    </main>

    <footer id="dock">
      <div class="dock-row ready-row">
        <div class="stat"><b id="best">0</b><span>best</span></div>
        <button id="play-btn" class="tt-plus" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z" /></svg>
          Play
        </button>
        <div class="stat"><b id="last">–</b><span>last run</span></div>
      </div>
      <div class="dock-row play-row">
        <div class="stat"><b id="score">0</b><span>reels</span></div>
        <div class="stat timer"><b id="timer">10.0</b><span>seconds</span></div>
        <div class="stat"><b id="ads">0</b><span>ads skipped</span></div>
      </div>
    </footer>

    <div id="game-over" class="overlay hidden">
      <div class="go-box">
        <span class="go-badge hidden" id="new-best">New best</span>
        <h2>Time's up</h2>
        <div class="go-score">
          <span class="big" id="final-score">0</span>
          <span class="unit">reels</span>
        </div>
        <div class="go-stats">
          <div><span id="final-ads">0</span><small>ads skipped</small></div>
          <div><span id="final-time">15s</span><small>survived</small></div>
        </div>
        <button id="again-btn" class="primary" type="button">Scroll again</button>
      </div>
    </div>

  </div>
  <script src="music.js"></script>
  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
