<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Doom Scroller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- START SCREEN -->
    <div id="start-screen" class="overlay">
      <div class="start-box">
        <div class="brand">
          <span class="brand-glyph">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 22h14" />
              <path d="M5 2h14" />
              <path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22" />
              <path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2" />
            </svg>
          </span>
          <h1 class="title">Doom<br />Scroller</h1>
        </div>
        <p class="tagline">How many reels can you survive before the clock runs out?</p>
        <ul class="rules">
          <li>
            <span class="rule-ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></svg></span>
            <span>5 seconds on the clock</span>
          </li>
          <li>
            <span class="rule-ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20" /><path d="m8 18 4 4 4-4" /><path d="m8 6 4-4 4 4" /></svg></span>
            <span>Scroll to race the feed</span>
          </li>
          <li>
            <span class="rule-ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 9-6 6" /><path d="M2.586 16.726A2 2 0 0 1 2 15.312V8.688a2 2 0 0 1 .586-1.414l4.688-4.688A2 2 0 0 1 8.688 2h6.624a2 2 0 0 1 1.414.586l4.688 4.688A2 2 0 0 1 22 8.688v6.624a2 2 0 0 1-.586 1.414l-4.688 4.688a2 2 0 0 1-1.414.586H8.688a2 2 0 0 1-1.414-.586z" /><path d="m9 9 6 6" /></svg></span>
            <span>Ads stop you — tap <b>X</b> to pass</span>
          </li>
          <li>
            <span class="rule-ic"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /><path d="M12 5v14" /></svg></span>
            <span><b>+1 second</b> for every ad closed</span>
          </li>
        </ul>
        <button id="start-btn" class="primary">Start scrolling</button>
      </div>
    </div>

    <!-- PLAY SCREEN -->
    <div id="play-screen" class="hidden">
      <div id="reels"></div>

      <div id="hud">
        <div class="hud-row">
          <div class="hud-stat left">
            <span class="label">Reels</span>
            <span class="value" id="score">0</span>
          </div>
          <div class="hud-timer">
            <span class="value" id="timer">5.0</span>
            <span class="label">seconds</span>
          </div>
          <div class="hud-stat right">
            <span class="label">Ads closed</span>
            <span class="value" id="ads">0</span>
          </div>
        </div>
        <div id="timebar"><div id="timebar-fill"></div></div>
      </div>

      <div id="game-over" class="overlay hidden">
        <div class="go-box">
          <h2>Time's up</h2>
          <div class="go-score">
            <span class="big" id="final-score">0</span>
            <span class="unit">reels</span>
          </div>
          <div class="go-stats">
            <div><span id="final-ads">0</span><small>ads closed</small></div>
            <div><span id="final-time">5s</span><small>survived</small></div>
          </div>
          <button id="again-btn" class="primary">Scroll again</button>
        </div>
      </div>
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
